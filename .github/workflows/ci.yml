name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs that need more (GHCR push) elevate locally.
permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.0'
  # A CI-only, non-secret placeholder — satisfies packages/config's zod
  # schema (JWT_SECRET must be >=32 chars) and the gmail-watch-renewal test
  # suite's own explicit "must be set" checks. Nothing real is encrypted or
  # signed with this value outside this ephemeral job; the Google API
  # boundary those tests touch is fully mocked (see gmail-watch-renewal.
  # test.ts / gmail-sync.integration.test.ts), so no real Gmail/GCP
  # resource is ever contacted.
  JWT_SECRET: ci-only-placeholder-not-a-real-secret-00000
  GMAIL_TOKEN_ENCRYPTION_KEY: ci-only-placeholder-not-a-real-secret-00000
  GOOGLE_PUBSUB_TOPIC: projects/ci-placeholder/topics/gmail-push
  DATABASE_URL: postgresql://ciperscope_ci:ciperscope_ci@localhost:5432/ciperscope_ci?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  # ---------------------------------------------------------------------
  # Stage 3 (Quality): lint. Typecheck is verified as part of the Build
  # job below — every package's own "build" script is `tsc` (or `tsc -b`
  # for apps/web), which performs full type-checking as part of emitting
  # dist/ output. There is no separate `--noEmit`-only script anywhere in
  # this repo, and the pipeline reuses existing package.json scripts
  # rather than inventing a parallel one purely to satisfy a label.
  # ---------------------------------------------------------------------
  quality:
    name: Quality (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  # ---------------------------------------------------------------------
  # Stage 5 (Build): every workspace package, the API, the worker, and the
  # frontend. Also the gate that proves typecheck passes (see note above).
  # Prisma client generation never requires production secrets (no
  # provider API keys, no real DATABASE_URL) — `prisma generate` only
  # reads the schema file.
  # ---------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm -C packages/database db:generate
      - name: Build all packages, API, worker, and frontend
        run: pnpm build

  # ---------------------------------------------------------------------
  # Stage 4 (Tests): unit + integration, against real ephemeral Postgres
  # and Redis service containers. Migrations are applied with
  # `prisma migrate deploy` (no shadow database involved — that mechanism
  # is only used by `migrate dev`/`migrate diff`), so this exercises the
  # exact same migration history a real deployment would apply.
  #
  # No VirusTotal/AbuseIPDB/MaxMind/webhook/blockchain credentials are set
  # here — every provider integration in this codebase already falls back
  # to an honest NOT_CONFIGURED/null state when its credentials are
  # absent (see e.g. services/worker/src/cti/CtiConfig.ts,
  # services/worker/src/domain-intel/DomainIntelConfig.ts,
  # services/worker/src/integrity/BlockchainAnchorConfig.ts), so the full
  # suite runs correctly without them by design, not by skipping tests.
  # ---------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ciperscope_ci
          POSTGRES_PASSWORD: ciperscope_ci
          POSTGRES_DB: ciperscope_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciperscope_ci -d ciperscope_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm -C packages/database db:generate
      - name: Build (tests import compiled workspace packages)
        run: pnpm build
      - name: Apply database migrations
        run: pnpm --filter @ciperscope/database exec prisma migrate deploy
      - name: Run tests (unit + integration)
        run: pnpm test

  # ---------------------------------------------------------------------
  # ML worker (Python/FastAPI) — separate toolchain, not part of the pnpm
  # workspace.
  # ---------------------------------------------------------------------
  ml-worker-test:
    name: ML Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ml-worker/requirements.txt
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run tests
        run: pytest -v

  # ---------------------------------------------------------------------
  # Stage 6: validate docker-compose configuration and that every image
  # this repo ships actually builds. A minimal, non-secret .env is written
  # only so `docker compose config`'s env_file interpolation has a file to
  # read — none of the values in it are real.
  # ---------------------------------------------------------------------
  docker-validate:
    name: Docker Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a non-secret placeholder .env for compose validation
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          JWT_SECRET=ci-only-placeholder-not-a-real-secret-00000
          DATABASE_URL=postgresql://user:password@localhost:5432/ciperscope_db?schema=public
          REDIS_URL=redis://localhost:6379
          EOF
      - name: Validate docker-compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build ML worker image (validate only, no push)
        uses: docker/build-push-action@v6
        with:
          context: services/ml-worker
          push: false
          cache-from: type=gha,scope=ml-worker
          cache-to: type=gha,mode=max,scope=ml-worker

  # ---------------------------------------------------------------------
  # Stage 7 (Security): dependency audit and secret scanning. Advisory
  # findings are surfaced but never silently discarded; only high/critical
  # severity dependency vulnerabilities and any detected secret fail the
  # job — this is a real gate, not `|| true`.
  # ---------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the latest commit
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `continue-on-error: true` (not `|| true`) is deliberate: the step
      # still reports its real exit code and shows as a warned/failed step
      # in the Actions UI — advisory findings stay visible, they are never
      # silently swallowed. The separate high/critical step below has no
      # such override and genuinely fails the job.
      - name: Dependency audit (advisory — full report, all severities)
        run: pnpm audit --prod
        continue-on-error: true
      - name: Dependency audit (blocking — high/critical only)
        run: pnpm audit --prod --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # Stage 8: Docker images, main-branch pushes only, gated on every check
  # above passing. Immutable SHA tag + branch metadata, built with
  # BuildKit, cached via the GitHub Actions cache backend, pushed to GHCR
  # using the workflow's own GITHUB_TOKEN (no manual registry credential).
  # ---------------------------------------------------------------------
  docker-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, build, test, ml-worker-test, docker-validate, security]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: services/api/Dockerfile
          - image: worker
            context: .
            file: services/worker/Dockerfile
          - image: ml-worker
            context: services/ml-worker
            file: services/ml-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------
  # Stage 10 (Deployment): deliberately not implemented. No cloud
  # deployment target, environment, or credentials are configured
  # anywhere in this repository — inventing one here would mean guessing
  # infrastructure that doesn't exist. The pipeline stops at publishing
  # images to GHCR; wiring an actual deploy step requires the target
  # platform (e.g. ECS/Cloud Run/Kubernetes) and its credentials to be
  # decided and added as repository/environment secrets first.
  # ---------------------------------------------------------------------
