version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ciperscope_postgres
    environment:
      POSTGRES_USER: ciperscope_user
      POSTGRES_PASSWORD: ciperscope_password
      POSTGRES_DB: ciperscope_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciperscope_user -d ciperscope_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Background Jobs & Caching
  redis:
    image: redis:7-alpine
    container_name: ciperscope_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ML Inference Service (Phase 11)
  ml-worker:
    build:
      context: ../../services/ml-worker
    container_name: ciperscope_ml_worker
    environment:
      - ML_SERVICE_TOKEN=internal-secret-token
    # No ports exposed to host. Only accessible via internal Docker network.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
